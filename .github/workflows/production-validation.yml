name: Production validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-production.txt pip-audit==2.10.1 bandit==1.8.6
      - run: python -m compileall -q flood tests infra
      - run: for script in apps/dashboard/*.js; do node --input-type=module --check < "$script"; done
      - run: python -m unittest discover -s tests -v
      - run: python scripts/secret_scan.py
      - run: pip-audit -r requirements-production.txt
      - run: bandit -r flood
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dawei-flood:production-readiness .
      - run: sh scripts/container-smoke.sh dawei-flood:production-readiness
      - run: sh scripts/commissioning-smoke.sh dawei-flood:production-readiness
      - run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e FLOOD_DOMAIN=flood.example -e TLS_CONTACT_EMAIL=operator@example.com caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028 caddy validate --config /etc/caddy/Caddyfile
      - run: docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" -e FLOOD_DOMAIN=flood.example caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028 caddy validate --config /etc/caddy/Caddyfile
  linux-deployment-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3 age rclone
      - run: sh infra/rehearse-linux.sh
      - run: sh infra/rehearse-linux.sh --ipv6
      - name: Approved image transfer and checksum rehearsal
        run: |
          python infra/transfer-image.py --output /tmp/dawei-approved-images
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('bootstrap', 'infra/bootstrap.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          path = Path('/tmp/dawei-approved-images/image-receipt.json')
          assert module.preloaded_images(path, load=True) == module.preloaded_images(path, load=True)
          archive = path.parent / 'application.tar'
          with archive.open('ab') as stream: stream.write(b'TAMPERED SYNTHETIC FIXTURE')
          try: module.preloaded_images(path)
          except ValueError: pass
          else: raise AssertionError('Corrupted transfer archive accepted')
          print('Exact approved AMD64 image and Caddy private transfer/load/tamper verification: PASS')
          PY
