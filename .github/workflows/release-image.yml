name: Build release image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-production.txt pip-audit==2.10.1 bandit==1.8.6
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q flood tests
      - run: for script in apps/dashboard/*.js; do node --input-type=module --check < "$script"; done
      - run: pip-audit -r requirements-production.txt
      - run: bandit -r flood
      - run: docker build -t flood-release .
      - run: sh scripts/container-smoke.sh flood-release
      - run: sh scripts/commissioning-smoke.sh flood-release
      - run: python3 scripts/secret_scan.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wai-999/dawei-flood-intellegence:${{ github.sha }}
